# Every pull request runs the project's checks, then builds the image and starts it on both CPU types.
# Publishing a GitHub release tagged vX.Y.Z does the same, then each machine pushes the image it tested
# and the publish job joins the two under one name. Nothing is published unless every check passed and
# the image answered on both. No step downloads from Docker Hub: its anonymous limit and outages failed
# CI at random, so builds use Docker's built-in builder and the base image comes from ECR Public.
name: Checks and release

on:
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: ./bootstrap.sh
      - run: ./check.sh

  # The image starts on an empty data folder and serves its page, on each CPU type natively.
  smoke:
    needs: checks
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write # a release pushes the image this job tested
    steps:
      - uses: actions/checkout@v7
      - run: docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" -t matinee:smoke .
      - name: Start the image and fetch its page
        run: |
          mkdir state && sudo chown 1000:1000 state
          docker run -d --name smoke -p 8000:8000 -v "$PWD/state:/state" matinee:smoke
          curl -fsS --retry 30 --retry-delay 1 --retry-all-errors -o /dev/null http://localhost:8000/ \
            || { docker logs smoke; exit 1; }
      - name: Push the tested image as X.Y.Z-${{ matrix.arch }}
        if: github.event_name == 'release'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "release tag $GITHUB_REF_NAME is not vX.Y.Z"; exit 1; }
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag matinee:smoke "$IMAGE:$version-${{ matrix.arch }}"
          docker push "$IMAGE:$version-${{ matrix.arch }}"

  # Release v0.2.1 publishes 0.2.1, 0.2 and latest, each naming both CPU types' tested images.
  publish:
    if: github.event_name == 'release'
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Join the two tested images under the release's names
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            -t "$IMAGE:$version" -t "$IMAGE:${version%.*}" -t "$IMAGE:latest" \
            "$IMAGE:$version-amd64" "$IMAGE:$version-arm64"
