# Every pull request runs the project's checks and starts the image on both CPU types.
# Publishing a GitHub release does the same, then pushes the image to GHCR: nothing is
# published unless every check passed and the image answered on both.
name: Checks and release

on:
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: ./bootstrap.sh
      - run: ./check.sh

  # The image starts on an empty data folder and serves its page, on each CPU type natively.
  smoke:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: matinee:smoke
          # The publish job reads this cache, so it ships the layers tested here.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
      - name: Start the image and fetch its page
        run: |
          mkdir state && sudo chown 1000:1000 state
          docker run -d --name smoke -p 8000:8000 -v "$PWD/state:/state" matinee:smoke
          curl -fsS --retry 30 --retry-delay 1 --retry-all-errors -o /dev/null http://localhost:8000/ \
            || { docker logs smoke; exit 1; }

  publish:
    if: github.event_name == 'release'
    needs: [checks, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # ponytail: rebuilds from the smoke jobs' cache rather than pushing their exact images;
      # switch to push-by-digest per runner if a published image ever differs from the tested one.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # Release v0.2.1 publishes 0.2.1, 0.2 and (by the action's default) latest.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64
