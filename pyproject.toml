[project]
name = "matinee"
version = "0.1.0"
description = "Matinee: a film picker for a home media library, one conversation at a time."
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "fastapi>=0.141",
    "uvicorn>=0.54",
]

[project.optional-dependencies]
# Pinned so a new release of a checker cannot fail an unrelated pull request; Dependabot
# proposes each upgrade as its own pull request (.github/dependabot.yml).
dev = [
    "ruff==0.16.8",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "complexipy==8.0.1",
    "pre-commit==4.6.2",
    "pandas-stubs==3.0.5.260914",
    "httpx==0.28.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "tools", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "BLE", "UP", "SIM", "C4", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.complexipy]
max-complexity-allowed = 15

[tool.mypy]
strict = true
files = ["src", "tools", "tests"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests", "tools"]
